# Blueprint do Render (Infrastructure as Code) — ver docs.render.com/infrastructure-as-code
#
# NUNCA colocar valores reais de segredo neste arquivo. Variáveis marcadas
# `sync: false` são preenchidas manualmente no dashboard do Render (aba
# Environment do serviço), nunca versionadas.
#
# Decisões (ver .planning/phases/01-fundacao-auth-papeis-e-base/1-RESEARCH.md,
# seção "Migrations on Render" / Pitfall 11 e 12):
# - Migrations rodam no Pre-Deploy Command (`prisma migrate deploy`), NUNCA no
#   start command — evita execução concorrente caso o serviço escale para
#   mais de uma instância.
# - Postgres no plano pago "starter" desde o dia 1 — o plano free expira em
#   30 dias (14 dias de carência antes de apagar os dados), inaceitável para
#   um projeto que já constrói dados reais desde a Fase 1.

databases:
  - name: controle-comercial-next-db
    plan: starter
    region: oregon
    postgresMajorVersion: "17"

services:
  - type: web
    name: controle-comercial-next
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    preDeployCommand: npx prisma migrate deploy
    envVars:
      # Conexão interna do Postgres do Render (mesma região) — preenchida
      # automaticamente pelo Render ao referenciar o database acima.
      - key: DATABASE_URL
        fromDatabase:
          name: controle-comercial-next-db
          property: connectionString

      # Segredos e configuração de auth — preenchidos manualmente no
      # dashboard (Environment) do serviço, nunca neste arquivo.
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false

      # Transientes: só necessárias para rodar `npx prisma db seed` uma vez
      # após o primeiro deploy (criação do admin inicial). Podem ser
      # removidas/rotacionadas do dashboard depois de seedar.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NOME
        sync: false
